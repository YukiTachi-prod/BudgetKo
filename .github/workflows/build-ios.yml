name: Build iOS App

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  build-ios:
    name: Build iOS IPA (Unsigned)
    runs-on: macos-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          
      - name: Install Dependencies
        run: flutter pub get

      - name: Build iOS Unsigned Archive
        # We build an unsigned archive here because building a signed IPA requires Apple Developer keys.
        # This allows you to verify that the iOS app compiles successfully on macOS.
        run: flutter build ipa --release --no-codesign
        
      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-archive
          path: build/ios/archive/Runner.xcarchive
